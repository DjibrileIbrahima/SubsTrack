
# Development mode — only runs the DB
# Backend and frontend run locally with hot reload
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d

services:
  redis:
    image: redis:7-alpine
    container_name: substrack_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16
    container_name: substrack_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-substrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-substrack}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
