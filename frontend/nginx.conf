# Port 80: redirect everything to HTTPS. With Cloudflare in "Full (strict)"
# mode all real traffic arrives on 443; this block is a safety net for direct
# hits. (Keep Cloudflare on Full/Full-strict — "Flexible" would loop here.)
server {
    listen 80;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare Origin CA certificate — mounted read-only from the host
    # (/etc/ssl/substrack on the EC2 box; see docker-compose.yml). These files
    # must exist BEFORE this container starts or nginx will exit.
    ssl_certificate     /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' cdn.plaid.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: *.plaid.com; connect-src 'self' *.plaid.com; frame-src 'self' *.plaid.com cdn.plaid.com; object-src 'none'; frame-ancestors 'none';" always;

    # Hide nginx version from error pages and headers
    server_tokens off;

    # Re-resolve backend hostname on every request via Docker's embedded DNS.
    # Without this, Nginx caches the IP at startup and returns 502 after backend restarts.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Trust ONLY Cloudflare edge IPs and take the real client IP from
    # CF-Connecting-IP. Without this the rate limiter can be defeated by a
    # spoofed X-Forwarded-For (any client picks its own limiter key).
    # Refresh ranges from https://www.cloudflare.com/ips/ periodically.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Proxy API requests to FastAPI backend
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # OVERWRITE (not $proxy_add_x_forwarded_for, which appends the
        # client-supplied chain) so the backend limiter keys on the real IP only.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Versioned assets (Vite adds content hash to filenames) — cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached so deploys take effect immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # All other routes go to React (handles client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
