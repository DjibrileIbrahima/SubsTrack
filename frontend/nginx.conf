server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' cdn.plaid.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: *.plaid.com; connect-src 'self' *.plaid.com; frame-src 'self' *.plaid.com cdn.plaid.com; object-src 'none'; frame-ancestors 'none';" always;

    # Hide nginx version from error pages and headers
    server_tokens off;

    # Proxy API requests to FastAPI backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Versioned assets (Vite adds content hash to filenames) — cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached so deploys take effect immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # All other routes go to React (handles client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
