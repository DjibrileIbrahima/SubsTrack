# Infrastructure only — db and redis.
# Backend, frontend, and worker run as ECS tasks on the same host.
# Ports are exposed to 127.0.0.1 so ECS host-network containers can reach them.

services:
  db:
    image: postgres:16
    container_name: substrack_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-substrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-substrack}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-substrack}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: substrack_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
