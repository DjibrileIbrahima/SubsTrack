# Production mode — runs all 5 services in containers
#
# Usage:
#   docker-compose up --build

services:
  db:
    image: postgres:16
    container_name: substrack_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-substrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-substrack}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U substrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: substrack_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: substrack_backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-substrack}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-substrack}
      REDIS_URL: redis://redis:6379

  worker:
    build: ./backend
    container_name: substrack_worker
    restart: unless-stopped
    command: python -m arq worker.WorkerSettings
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-substrack}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-substrack}
      REDIS_URL: redis://redis:6379

  frontend:
    build: ./frontend
    container_name: substrack_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Cloudflare Origin CA cert + key. Create these on the host BEFORE
      # starting (nginx exits if they're missing):
      #   /etc/ssl/substrack/origin.crt
      #   /etc/ssl/substrack/origin.key   (chmod 600)
      - /etc/ssl/substrack:/etc/nginx/ssl:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
