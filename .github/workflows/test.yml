name: CI / CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Backend tests ────────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pytest pytest-asyncio pytest-mock aiosqlite

      - name: Run backend tests
        working-directory: backend
        env:
          JWT_SECRET: "ci-test-jwt-secret-long-enough-for-testing-!!"
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY_TEST || 'dGhpcyBpcyBhIHRlc3Qga2V5IHBhZGRlZCBoZXJlISE=' }}
          REDIS_URL: "memory://"
          PLAID_CLIENT_ID: "test"
          PLAID_SECRET: "test"
          COOKIE_SECURE: "false"
        run: pytest -v --tb=short

  # ── Frontend tests ───────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend Tests (vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

  # ── Deploy (only on master push, both test jobs must pass) ──────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/substrack
            git pull
            sudo /opt/substrack/load-secrets.sh
            export POSTGRES_PASSWORD=$(grep POSTGRES_PASSWORD backend/.env | cut -d= -f2)
            sudo docker-compose up --build -d
            sudo docker-compose exec -T backend python -m alembic upgrade head
