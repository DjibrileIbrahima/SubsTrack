name: CI / CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_REGION: us-east-1

jobs:
  # ── Backend lint ─────────────────────────────────────────────────────────────
  lint-backend:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        working-directory: backend
        run: ruff check .

  # ── Backend security scan ────────────────────────────────────────────────────
  security-backend:
    name: Backend Security (bandit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit
        working-directory: backend
        run: bandit -r . -ll -x tests/,migrations/

  # ── Backend tests ────────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pytest pytest-asyncio pytest-mock aiosqlite

      - name: Run backend tests
        working-directory: backend
        env:
          JWT_SECRET: "ci-test-jwt-secret-long-enough-for-testing-!!"
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY_TEST || 'dGhpcyBpcyBhIHRlc3Qga2V5IHBhZGRlZCBoZXJlISE=' }}
          REDIS_URL: "redis://localhost:6379"
          PLAID_CLIENT_ID: "test"
          PLAID_SECRET: "test"
          COOKIE_SECURE: "false"
        run: pytest -v --tb=short

  # ── Frontend tests ───────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend Tests (vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

  # ── Frontend build verification ──────────────────────────────────────────────
  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # ── Deploy (only on master push, all jobs must pass) ─────────────────────────
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: [lint-backend, security-backend, test-backend, test-frontend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/substrack-backend:$IMAGE_TAG \
                       -t $ECR_REGISTRY/substrack-backend:latest \
                       ./backend
          docker push $ECR_REGISTRY/substrack-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/substrack-backend:latest
          echo "BACKEND_IMAGE=$ECR_REGISTRY/substrack-backend:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/substrack-frontend:$IMAGE_TAG \
                       -t $ECR_REGISTRY/substrack-frontend:latest \
                       ./frontend
          docker push $ECR_REGISTRY/substrack-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/substrack-frontend:latest
          echo "FRONTEND_IMAGE=$ECR_REGISTRY/substrack-frontend:$IMAGE_TAG" >> $GITHUB_ENV

      # ── Deploy substrack-app (frontend + backend) ─────────────────────────
      - name: Download current app task definition
        run: |
          aws ecs describe-task-definition --task-definition substrack-app \
            --query taskDefinition > ecs/current-task-definition.json

      - name: Render backend container into task definition
        id: render-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs/current-task-definition.json
          container-name:  backend
          image:           ${{ env.BACKEND_IMAGE }}

      - name: Render frontend container into task definition
        id: render-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-backend.outputs.task-definition }}
          container-name:  frontend
          image:           ${{ env.FRONTEND_IMAGE }}

      - name: Deploy app service to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:          ${{ steps.render-frontend.outputs.task-definition }}
          service:                  substrack-app-service
          cluster:                  substrack-cluster
          wait-for-service-stability: true

      # ── Deploy substrack-worker ───────────────────────────────────────────
      - name: Download current worker task definition
        run: |
          aws ecs describe-task-definition --task-definition substrack-worker \
            --query taskDefinition > ecs/current-worker-task-definition.json

      - name: Render worker container into task definition
        id: render-worker
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs/current-worker-task-definition.json
          container-name:  worker
          image:           ${{ env.BACKEND_IMAGE }}

      - name: Deploy worker service to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:          ${{ steps.render-worker.outputs.task-definition }}
          service:                  substrack-worker-service
          cluster:                  substrack-cluster
          wait-for-service-stability: true
